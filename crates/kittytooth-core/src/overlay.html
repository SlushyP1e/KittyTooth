<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KittyTooth Overlay</title>
<!--
  OBS browser source. Query options:
    ?color=ff6fa8   heart/accent color (hex, no #)
    ?text=ffffff    number color
    ?size=96        font size in px
    ?hide=1         hide completely while disconnected
    ?unit=0         hide the "bpm" label
-->
<style>
  :root { --accent: #ff6fa8; --text: #ffffff; --size: 96px; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
  .wrap { display: inline-flex; align-items: center; gap: calc(var(--size) * 0.18); padding: 8px 12px;
          color: var(--text); text-shadow: 0 2px 8px rgba(0,0,0,.45); transition: opacity .3s; }
  .wrap.off { opacity: .45; }
  .wrap.hidden { opacity: 0; }
  svg { width: calc(var(--size) * 0.9); height: calc(var(--size) * 0.9); fill: var(--accent);
        filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); transform-origin: 50% 55%; }
  svg.beat { animation: beat .32s cubic-bezier(.2,.8,.3,1); }
  @keyframes beat { 0% { transform: scale(1); } 25% { transform: scale(1.16); } 100% { transform: scale(1); } }
  .num { font-size: var(--size); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.02em; }
  .unit { font-size: calc(var(--size) * 0.3); font-weight: 600; opacity: .8; margin-left: .15em; }
  @media (prefers-reduced-motion: reduce) { svg.beat { animation: none; opacity: .85; } }
</style>
</head>
<body>
<div class="wrap off" id="wrap">
  <svg id="heart" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3.4 8.1 3.9 2.6l4.3 3.1A6.1 6.1 0 0 1 12 8c1.1-1.2 2.3-2 3.8-2.3l4.3-3.1.5 5.5c1.6 3-.1 6.2-2.6 8.6C16 18.6 12 21.2 12 21.2s-4-2.6-6-4.5C3.5 14.3 1.8 11.1 3.4 8.1z"/>
  </svg>
  <span><span class="num" id="num">--</span><span class="unit" id="unit">bpm</span></span>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const hex = (v) => /^[0-9a-fA-F]{6}$/.test(v || "") ? "#" + v : null;
  const root = document.documentElement.style;
  if (hex(q.get("color"))) root.setProperty("--accent", hex(q.get("color")));
  if (hex(q.get("text"))) root.setProperty("--text", hex(q.get("text")));
  const size = parseInt(q.get("size") || "", 10);
  if (size >= 16 && size <= 400) root.setProperty("--size", size + "px");
  if (q.get("unit") === "0") document.getElementById("unit").remove();
  const hide = q.get("hide") === "1";
  const wrap = document.getElementById("wrap");
  const num = document.getElementById("num");
  const heart = document.getElementById("heart");
  let connected = false;
  function connect() {
    const es = new EventSource("/events");
    es.addEventListener("state", (e) => {
      const s = JSON.parse(e.data);
      connected = !!s.connected && s.bpm != null;
      num.textContent = connected ? String(s.bpm) : "--";
      wrap.classList.toggle("off", !connected);
      wrap.classList.toggle("hidden", hide && !connected);
    });
    es.addEventListener("beat", () => {
      if (!connected) return;
      heart.classList.remove("beat");
      void heart.getBoundingClientRect();
      heart.classList.add("beat");
    });
    es.onerror = () => { es.close(); wrap.classList.add("off"); setTimeout(connect, 2000); };
  }
  connect();
</script>
</body>
</html>
