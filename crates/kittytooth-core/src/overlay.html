<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KittyTooth Overlay</title>
<!--
  OBS browser source (transparent). Query options:
    ?size=96      BPM font size in px
    ?color=ffadc6 accent (hex, no #)
    ?pill=1       charcoal pill backing
    ?hide=1       hide completely while disconnected
    ?unit=0       hide the "bpm" label
-->
<style>
  @font-face { font-family: "Bricolage Grotesque"; font-weight: 800; font-display: block; src: url("/fonts/bricolage-800.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; font-display: block; src: url("/fonts/jetbrains-400.woff2") format("woff2"); }
  :root { --pink: #ffadc6; --text: #e8e8ed; --muted: #9699a5; --slate-0: #090b0c; --size: 96px; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  .wrap { display: inline-flex; align-items: center; gap: calc(var(--size) * 0.16); padding: 10px 14px; transition: opacity .3s; }
  .wrap.pill { background: color-mix(in srgb, var(--slate-0) 80%, transparent); border-radius: 18px; padding: calc(var(--size) * 0.12) calc(var(--size) * 0.24); }
  .wrap.off { opacity: .5; }
  .wrap.hidden { opacity: 0; }
  svg { width: calc(var(--size) * 0.72); height: calc(var(--size) * 0.72); transform-origin: 50% 55%; }
  svg path { fill: color-mix(in srgb, var(--pink) 14%, transparent); stroke: var(--pink); stroke-width: 1.6; stroke-linejoin: round; }
  .off svg path { fill: none; stroke: var(--muted); }
  svg.beat { animation: beat 160ms ease-out; }
  @keyframes beat { 0% { transform: scale(1); filter: drop-shadow(0 0 0 var(--pink)); } 35% { transform: scale(1.08); filter: drop-shadow(0 0 6px var(--pink)); } 100% { transform: scale(1); filter: drop-shadow(0 0 0 transparent); } }
  .num { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: var(--size); line-height: 1; letter-spacing: -0.03em; color: var(--text); font-variant-numeric: tabular-nums; }
  .unit { font-family: "JetBrains Mono", monospace; font-size: calc(var(--size) * 0.16); color: var(--muted); margin-left: .35em; }
  @media (prefers-reduced-motion: reduce) { svg.beat { animation: none; } }
</style>
</head>
<body>
<div class="wrap off" id="wrap">
  <svg id="heart" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4.2 8.4 4.6 3.4l3.7 2.7A5.6 5.6 0 0 1 12 8.3a5.6 5.6 0 0 1 3.7-2.2l3.7-2.7.4 5c1.5 2.8-.1 5.8-2.4 8-1.8 1.8-5.4 4.1-5.4 4.1s-3.6-2.3-5.4-4.1c-2.3-2.2-3.9-5.2-2.4-8z"/>
  </svg>
  <span><span class="num" id="num">--</span><span class="unit" id="unit">bpm</span></span>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const hex = (v) => /^[0-9a-fA-F]{6}$/.test(v || "") ? "#" + v : null;
  const root = document.documentElement.style;
  if (hex(q.get("color"))) root.setProperty("--pink", hex(q.get("color")));
  const size = parseInt(q.get("size") || "", 10);
  if (size >= 16 && size <= 400) root.setProperty("--size", size + "px");
  if (q.get("unit") === "0") document.getElementById("unit").remove();
  const hide = q.get("hide") === "1";
  const wrap = document.getElementById("wrap");
  if (q.get("pill") === "1") wrap.classList.add("pill");
  const num = document.getElementById("num");
  const heart = document.getElementById("heart");
  let connected = false;
  function connect() {
    const es = new EventSource("/events");
    es.addEventListener("state", (e) => {
      const s = JSON.parse(e.data);
      connected = !!s.connected && s.bpm != null;
      num.textContent = connected ? String(s.bpm) : "--";
      wrap.classList.toggle("off", !connected);
      wrap.classList.toggle("hidden", hide && !connected);
    });
    es.addEventListener("beat", () => {
      if (!connected) return;
      heart.classList.remove("beat");
      void heart.getBoundingClientRect();
      heart.classList.add("beat");
    });
    es.onerror = () => { es.close(); wrap.classList.add("off"); setTimeout(connect, 2000); };
  }
  connect();
</script>
</body>
</html>
