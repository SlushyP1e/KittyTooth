[package]
name = "kittytooth-core"
description = "KittyTooth core: heart rate parsing, processing, OSC output and engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["ble", "ant"]
ble = ["dep:btleplug", "dep:futures"]
ant = ["dep:nusb"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
rosc = "0.11"
mdns-sd = "0.22"
rand = "0.9"
btleplug = { version = "0.13", optional = true }
futures = { version = "0.3", optional = true }
nusb = { version = "0.2", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
