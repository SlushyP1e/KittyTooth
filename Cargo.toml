[workspace]
resolver = "2"
members = ["crates/kittytooth-core", "src-tauri"]

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "MIT"
authors = ["SlushyPie"]
repository = "https://github.com/SlushyP1e/KittyTooth"
rust-version = "1.87"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
