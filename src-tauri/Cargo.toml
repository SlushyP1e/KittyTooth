[package]
name = "kittytooth"
description = "KittyTooth: Bluetooth heart rate to VRChat over OSC"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "kittytooth"

[lib]
name = "kittytooth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kittytooth-core = { path = "../crates/kittytooth-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Tokens and keys live in the OS credential store (Windows Credential Manager, macOS
# Keychain, Secret Service on Linux), never in config.json.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Same versions Tauri uses; for the WebView2 memory target while in the tray.
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
